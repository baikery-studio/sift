version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (dependabot updates the pin + the # vX.Y.Z
  # comment together), so pinning does not mean staleness.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # Python helpers are stdlib-only, but track any future dev/test pip deps.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
