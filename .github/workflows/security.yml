name: security

# Advisory security scanning: CodeQL static analysis (Python helpers) + gitleaks secret
# scan. CodeQL is pinned to a commit SHA; gitleaks runs the OSS binary pinned by version +
# sha256 (the gitleaks-action wrapper requires a paid license for org repos). Findings
# surface in the logs; these jobs do not block merges (required gates are selftest + self-review).

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'   # weekly, Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: initialize CodeQL
        uses: github/codeql-action/init@c35d1b164463ee62a100735382aaaa525c5d3496 # codeql-bundle-v2.25.6
        with:
          languages: python
      - name: analyze
        uses: github/codeql-action/analyze@c35d1b164463ee62a100735382aaaa525c5d3496 # codeql-bundle-v2.25.6

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: gitleaks (OSS binary, version + sha256 pinned)
        run: |
          # The gitleaks-action wrapper gates org repos behind a paid license; the OSS binary
          # does not. Pin the version and verify its checksum, then scan the full git history
          # using .gitleaks.toml (default ruleset + a narrow allowlist for fake test fixtures).
          ver=8.30.1
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          echo "${sha}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks version
          ./gitleaks git . -c .gitleaks.toml --no-banner --redact --exit-code 1
